name: CI - Pull Request

permissions:
    contents: read

on:
    pull_request:
        branches: ["**"]

# A new push to a pull request makes the previous run's result irrelevant, so stop paying for it.
concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

env:
    VULKAN_SDK_VERSION: "1.4.357.0"

jobs:
    quick-checks:
        name: Quick Checks (markdown)
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Setup Node.js
              id: setup-node
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                node-version: "lts/*"

            - name: Get markdownlint-cli2 version
              id: mdlint-version
              run: echo "version=$(npm view markdownlint-cli2 version)" >> "$GITHUB_OUTPUT"

            # Restore cache from main branch (read-only)
            - name: Restore npm cache
              uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                path: ~/.npm
                key: npm-markdownlint-${{ runner.os }}-node-${{ steps.setup-node.outputs.node-version }}-mdlint-${{ steps.mdlint-version.outputs.version }}

            - name: Install markdownlint-cli2
              run: npm install -g markdownlint-cli2@${{ steps.mdlint-version.outputs.version }}

            - name: Lint markdown
              run: markdownlint-cli2 "**/*.md"

            # A carriage return sitting inside a line is invisible in every editor, survives
            # clang-format and markdownlint, and reads as ordinary text in review. Three reached
            # main before this step existed, each one a Doxygen \return written through a tool
            # chain that collapsed the escape, leaving a control character and a word reading
            # "eturn" where the tag should be.
            #
            # .gitattributes normalises to LF and this runner is Linux, so the checkout contains
            # no legitimate carriage return at all and any match is a stray. -I skips binary
            # files, and taking the file list from git keeps build outputs and untracked scratch
            # out of it.
            - name: Check for stray carriage returns
              run: |
                if git ls-files -z | xargs -0 grep -lIP '\r'; then
                    echo "::error::The files above contain a carriage return. Line endings here are LF, so it is a stray one inside a line - look for a Doxygen tag written through a tool that ate the escape."
                    exit 1
                fi

            # TGL_ABI_VERSION stops the Grid loading a Program built against a different layout, and
            # nothing enforces it by itself. A forgotten bump leaves both sides agreeing on the number
            # while disagreeing about the bytes - which is the silent memory corruption the number is
            # kept for, and it does not fail loudly at run time. So the header is fingerprinted with
            # the version line removed, and a changed fingerprint at an unchanged version is refused
            # here rather than in a reviewer's memory.
            - name: Check the Program ABI version was bumped
              run: python3 tools/check_abi_version.py check

    build:
        name: Build (${{ matrix.preset }})
        needs: quick-checks
        timeout-minutes: 30

        strategy:
            fail-fast: false
            max-parallel: 20

            matrix:
                include:
                    - preset: windows-msvc
                      os: windows-latest
                      msvc-setup-needed: true
                    - preset: windows-clang-cl
                      os: windows-latest
                    - preset: windows-mingw
                      os: windows-latest
                    - preset: linux-x11-gcc
                      os: ubuntu-latest
                    - preset: linux-x11-clang
                      os: ubuntu-latest

        runs-on: ${{ matrix.os }}

        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Install XCB development headers (Linux)
              if: runner.os == 'Linux'
              run: sudo apt-get update && sudo apt-get install -y libxcb1-dev

            - name: Setup Vulkan SDK (Windows)
              if: runner.os == 'Windows'
              uses: ./.github/actions/setup-vulkan-windows
              with:
                version: ${{ env.VULKAN_SDK_VERSION }}

            - name: Setup Vulkan SDK (Linux)
              if: runner.os == 'Linux'
              uses: ./.github/actions/setup-vulkan-linux
              with:
                version: ${{ env.VULKAN_SDK_VERSION }}

            - name: Setup MSVC environment
              if: matrix.msvc-setup-needed
              shell: pwsh
              run: |
                  # Visual Studio ships on the Windows runners, so the developer environment is
                  # imported directly rather than through a third-party action: the repository
                  # policy allows GitHub-owned actions only.
                  $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
                  $install_path = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
                  if (-not $install_path) { throw "No Visual Studio installation with the C++ toolset was found." }
                  $vcvars = Join-Path $install_path "VC\Auxiliary\Build\vcvars64.bat"
                  if (-not (Test-Path $vcvars)) { throw "vcvars64.bat not found at $vcvars." }
                  # Run vcvars64 in cmd, then carry the resulting environment into later steps.
                  cmd /c "call `"$vcvars`" && set" | ForEach-Object {
                      if ($_ -match '^([^=]+)=(.*)$') {
                          $name = $matches[1]
                          $value = $matches[2]
                          # GITHUB_* are owned by the runner and must not be overwritten.
                          if ($name -notmatch '^(GITHUB_|RUNNER_)') {
                              "$name=$value" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
                          }
                      }
                  }

            - name: Run CMake workflow
              run: cmake --workflow --preset=${{ matrix.preset }}

    sanitisers:
        name: Sanitiser (${{ matrix.name }})
        needs: quick-checks
        timeout-minutes: 30

        strategy:
            fail-fast: false
            matrix:
                include:
                    - name: ASan+UBSan
                      preset: linux-x11-clang-asan
                    - name: TSan
                      preset: linux-x11-clang-tsan
                      # logger_tests hangs under TSan due to glibc false positive
                      # (tpp.c:83 __pthread_tpp_change_priority assertion).
                      # Exclude it — logger thread safety is validated by ASan.
                      test_exclude: logger_tests

        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Install XCB development headers
              run: sudo apt-get update && sudo apt-get install -y libxcb1-dev

            - name: Setup Vulkan SDK
              uses: ./.github/actions/setup-vulkan-linux
              with:
                version: ${{ env.VULKAN_SDK_VERSION }}

            - name: Configure
              run: cmake --preset=${{ matrix.preset }}

            - name: Build (Debug)
              run: cmake --build --preset=${{ matrix.preset }}-debug

            - name: Test (Debug)
              env:
                TSAN_OPTIONS: "suppressions=${{ github.workspace }}/tsan_suppressions.txt"
              run: >
                ctest --preset=${{ matrix.preset }}-debug
                ${{ matrix.test_exclude && format('--exclude-regex {0}', matrix.test_exclude) || '' }}

    # Every check that can catch a traversal regression needs a device, so all of them used to fire
    # only when somebody remembered them on a machine with a GPU attached. Lavapipe — Mesa's software
    # Vulkan driver — is a device by every measure this renderer cares about: Vulkan 1.3, dynamic
    # rendering, synchronisation2, and a graphics family that dispatches compute. It runs both
    # comparisons in about a second each.
    #
    # What runs here is deliberately the pair that compares the host against the device, not the
    # recorded render. Those two are tolerance-based, so they mean the same thing on any
    # implementation. A digest is a bit pattern and would pin this job to one Mesa build and one set
    # of CPU features, which is a maintenance burden bought for a check the two below already make.
    verify-on-cpu:
        name: Verify (software Vulkan)
        needs: quick-checks
        timeout-minutes: 20
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Install XCB development headers and lavapipe
              run: |
                sudo apt-get update
                sudo apt-get install -y libxcb1-dev mesa-vulkan-drivers

            - name: Setup Vulkan SDK
              uses: ./.github/actions/setup-vulkan-linux
              with:
                version: ${{ env.VULKAN_SDK_VERSION }}

            - name: Configure
              run: cmake --preset=linux-x11-gcc

            - name: Build (Release)
              run: cmake --build --preset=linux-x11-gcc-release

            # Finding the ICD rather than assuming its path, and printing the directory when it is
            # absent. A VK_ICD_FILENAMES pointing at a file that is not there leaves the loader with
            # no drivers at all, and the failure it then reports — ErrorIncompatibleDriver from
            # vkCreateInstance — is indistinguishable from a driver too old to use. One listing turns
            # a guess into an answer.
            - name: Locate the software ICD
              run: |
                echo "Vulkan ICD directory:"
                ls -la /usr/share/vulkan/icd.d/ || echo "  (no such directory)"
                icd=$(ls /usr/share/vulkan/icd.d/lvp_icd*.json 2>/dev/null | head -1)
                if [[ -z "$icd" ]]; then
                    echo "::error::lavapipe ICD not found. mesa-vulkan-drivers may not ship it on this image."
                    exit 1
                fi
                echo "Using $icd"
                cat "$icd"
                echo "VK_ICD_FILENAMES=$icd" >> "$GITHUB_ENV"

            - name: Report the device
              run: ./build/linux-x11-gcc/src/Release/TronGridLite --list-gpus

            - name: The shader and the host must agree
              run: ./build/linux-x11-gcc/src/Release/TronGridLite --verify-acoustics

            # The same comparison with the Grid placed at an angle, which is the only thing that
            # exercises transform arithmetic: at the identity a matrix and its transpose are the same
            # sixteen numbers.
            - name: They must still agree at an angle
              run: ./build/linux-x11-gcc/src/Release/TronGridLite --verify-scene

            # One bounce collapses the Whitted walk to the host's first hit, which checks the senses
            # pass's own plumbing — the ray buffer, the offsets, the readback. The shading it shares
            # with the renderer stays licensed by the reference render digest.
            - name: A creature's eye and the host must agree
              run: ./build/linux-x11-gcc/src/Release/TronGridLite --verify-senses

    ci-success:
        name: CI Success
        needs: [quick-checks, build, sanitisers, verify-on-cpu]
        runs-on: ubuntu-latest
        if: always()

        steps:
            - name: Check if all jobs succeeded
              run: |
                if [[ "${{ needs.quick-checks.result }}" != "success" ]] || \
                   [[ "${{ needs.build.result }}" != "success" ]] || \
                   [[ "${{ needs.sanitisers.result }}" != "success" ]] || \
                   [[ "${{ needs.verify-on-cpu.result }}" != "success" ]]; then
                    echo "One or more jobs failed"
                    exit 1
                fi
                echo "All jobs completed successfully"
