name: Release

permissions:
    contents: write
    id-token: write
    attestations: write

on:
    push:
        tags:
            - "v[0-9]+.[0-9]+.[0-9]+"
            - "v[0-9]+.[0-9]+.[0-9]+-*"

    # The dry run: a manual dispatch builds, packages and smoke-tests every artefact exactly as
    # a tag would, then stops before the one irreversible step. A packaging change is proven
    # end to end before a tag exists, and no throwaway tag is ever cut to find out.
    workflow_dispatch:

env:
    VULKAN_SDK_VERSION: "1.4.357.0"

jobs:
    validate:
        name: Validate Release
        runs-on: ubuntu-latest
        timeout-minutes: 5

        outputs:
            version: ${{ steps.version.outputs.version }}
            tag: ${{ steps.version.outputs.tag }}
            is-release: ${{ steps.version.outputs.is-release }}

        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Determine version
              id: version
              shell: bash
              run: |
                if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
                    # A rehearsal: the version file's own number, marked so no artefact of a dry
                    # run can be mistaken for a release, and nothing is published.
                    VERSION="$(grep 'VERSION ' CMakeLists.txt | head -1 | sed 's/.*VERSION \([0-9]*\.[0-9]*\.[0-9]*\).*/\1/')-dryrun"
                    echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
                    echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
                    echo "is-release=false" >> "$GITHUB_OUTPUT"
                    echo "Dry run: building as ${VERSION}, publishing nothing."
                    exit 0
                fi

                TAG="${GITHUB_REF#refs/tags/}"

                # Validate tag format
                if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-.*)?$ ]]; then
                    echo "Error: Invalid tag format: $TAG"
                    echo "Expected format: v0.0.0 or v0.0.0-suffix"
                    exit 1
                fi

                VERSION="${TAG#v}"
                echo "tag=$TAG" >> "$GITHUB_OUTPUT"
                echo "version=$VERSION" >> "$GITHUB_OUTPUT"
                echo "is-release=true" >> "$GITHUB_OUTPUT"
                echo "Release version: $VERSION (tag: $TAG)"

            # Three gates that fail in seconds rather than after a thirty-minute matrix. A tag can be
            # pushed from any commit: one that never reached main, one that sat between a red CI run
            # and its fix. Only a commit on main - one every gate has passed - may be released.
            - name: The tagged commit is on main
              if: steps.version.outputs.is-release == 'true'
              shell: bash
              run: |
                git fetch --no-tags --depth=200 origin main
                if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
                    echo "::error::The tagged commit ${GITHUB_SHA} is not on main. Release from main, or merge first."
                    exit 1
                fi
                echo "The tagged commit is on main."

            # The release notes are the CHANGELOG entry, so a version without one is a release
            # with no words: refused on a tag, a warning on a rehearsal.
            - name: CHANGELOG.md has an entry for this version
              shell: bash
              run: |
                VERSION="${{ steps.version.outputs.version }}"
                BASE="${VERSION%-dryrun}"
                if grep -q "^## \[${BASE}\]" CHANGELOG.md; then
                    echo "CHANGELOG.md carries ## [${BASE}]."
                elif [[ "${{ steps.version.outputs.is-release }}" == "true" ]]; then
                    echo "::error::CHANGELOG.md has no ## [${BASE}] section. Move the Unreleased entries under the version before tagging."
                    exit 1
                else
                    echo "::warning::CHANGELOG.md has no ## [${BASE}] section yet; a real release would refuse here."
                fi

            - name: No release exists for this tag yet
              if: steps.version.outputs.is-release == 'true'
              shell: bash
              env:
                GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                if gh release view "${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
                    echo "::error::A release for ${{ steps.version.outputs.tag }} already exists. Delete it deliberately, or tag the next version."
                    exit 1
                fi
                echo "No release for ${{ steps.version.outputs.tag }} yet."

            - name: Verify CMakeLists.txt version matches tag
              shell: bash
              run: |
                CMAKE_VERSION=$(grep 'VERSION ' CMakeLists.txt | head -1 | sed 's/.*VERSION \([0-9]*\.[0-9]*\.[0-9]*\).*/\1/')
                TAG_VERSION="${{ steps.version.outputs.version }}"

                # For pre-release tags like v0.1.0-rc1, compare base version
                BASE_TAG_VERSION="${TAG_VERSION%%-*}"

                if [[ "$CMAKE_VERSION" != "$BASE_TAG_VERSION" ]]; then
                    echo "Error: Version mismatch!"
                    echo "  CMakeLists.txt: $CMAKE_VERSION"
                    echo "  Tag:            $BASE_TAG_VERSION"
                    echo ""
                    echo "Update CMakeLists.txt version before tagging."
                    exit 1
                fi

                echo "Version verified: $CMAKE_VERSION"

    build:
        name: Build (${{ matrix.preset }})
        needs: validate
        timeout-minutes: 30

        strategy:
            fail-fast: false
            matrix:
                include:
                    - os: windows-latest
                      preset: windows-msvc
                      msvc-setup-needed: true
                      artifact: tron-grid-lite-windows-x86_64
                      binary: TronGridLite.exe
                      archive: zip

                    - os: ubuntu-latest
                      preset: linux-x11-gcc
                      artifact: tron-grid-lite-linux-x86_64
                      binary: TronGridLite
                      archive: tar.gz

        runs-on: ${{ matrix.os }}

        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                submodules: true

            # A hung Ubuntu mirror once held jobs here for their whole 30-minute timeout. No
            # retries, deliberately - a retry can mask a real issue. The step is simply cut short,
            # so a dead mirror is a fast, legible red and rerunning stays a decision.
            - name: Install XCB development headers (Linux)
              if: runner.os == 'Linux'
              timeout-minutes: 1
              run: sudo apt-get update && sudo apt-get install -y libxcb1-dev

            - name: Setup Vulkan SDK (Windows)
              if: runner.os == 'Windows'
              uses: ./.github/actions/setup-vulkan-windows
              with:
                version: ${{ env.VULKAN_SDK_VERSION }}

            - name: Setup Vulkan SDK (Linux)
              if: runner.os == 'Linux'
              uses: ./.github/actions/setup-vulkan-linux
              with:
                version: ${{ env.VULKAN_SDK_VERSION }}

            - name: Setup MSVC environment
              if: matrix.msvc-setup-needed
              shell: pwsh
              run: |
                  # Visual Studio ships on the Windows runners, so the developer environment is
                  # imported directly rather than through a third-party action: the repository
                  # policy allows GitHub-owned actions only.
                  $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
                  $install_path = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
                  if (-not $install_path) { throw "No Visual Studio installation with the C++ toolset was found." }
                  $vcvars = Join-Path $install_path "VC\Auxiliary\Build\vcvars64.bat"
                  if (-not (Test-Path $vcvars)) { throw "vcvars64.bat not found at $vcvars." }
                  # Run vcvars64 in cmd, then carry the resulting environment into later steps.
                  cmd /c "call `"$vcvars`" && set" | ForEach-Object {
                      if ($_ -match '^([^=]+)=(.*)$') {
                          $name = $matches[1]
                          $value = $matches[2]
                          # GITHUB_* are owned by the runner and must not be overwritten.
                          if ($name -notmatch '^(GITHUB_|RUNNER_)') {
                              "$name=$value" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
                          }
                      }
                  }

            # No caching for release builds - they're one-off events triggered by
            # version tags, so caches would never be reused and just waste storage

            - name: Configure
              run: cmake --preset ${{ matrix.preset }}

            - name: Build release binary
              run: cmake --build build/${{ matrix.preset }} --config Release --verbose

            # A tag can be pushed from any commit, including one that never reached main or that
            # sat between a red CI run and its fix. Without this the workflow would happily build,
            # sign, attest and publish binaries whose tests fail — and the attestation would then
            # vouch for the provenance of an untested artefact.
            - name: Test release build
              run: ctest --test-dir build/${{ matrix.preset }} --build-config Release --output-on-failure

            - name: Prepare artifact (Unix)
              if: runner.os != 'Windows'
              shell: bash
              run: |
                cmake --install build/${{ matrix.preset }} --config Release --prefix dist
                cp README.md LICENCE CHANGELOG.md dist/
                cd dist
                tar -czvf ../${{ matrix.artifact }}.tar.gz *

            - name: Prepare artifact (Windows)
              if: runner.os == 'Windows'
              shell: bash
              run: |
                cmake --install build/${{ matrix.preset }} --config Release --prefix dist
                cp README.md LICENCE CHANGELOG.md dist/
                cd dist
                7z a -tzip ../${{ matrix.artifact }}.zip *

            # The artefact as a downloader will meet it: unpacked into a clean directory, every
            # file it must carry present by name, and the packaged binary itself run - not the one
            # in the build tree. A green matrix hides a renamed file or a library left behind; this
            # does not.
            - name: Unpack and run the packaged artefact (Unix)
              if: runner.os != 'Windows'
              shell: bash
              run: |
                rm -rf smoke && mkdir smoke && tar -xzf ${{ matrix.artifact }}.tar.gz -C smoke
                cd smoke
                for required in TronGridLite liblink.so README.md LICENCE CHANGELOG.md; do
                    [[ -e "$required" ]] || { echo "::error::The artefact is missing $required"; ls -la; exit 1; }
                done
                ls *.spv >/dev/null || { echo "::error::The artefact carries no shaders"; exit 1; }
                ./TronGridLite --version | tee version.txt
                grep -q "TronGrid Lite" version.txt || { echo "::error::The packaged binary did not name itself"; exit 1; }

            - name: Unpack and run the packaged artefact (Windows)
              if: runner.os == 'Windows'
              shell: bash
              run: |
                rm -rf smoke && mkdir smoke && 7z x -osmoke ${{ matrix.artifact }}.zip >/dev/null
                cd smoke
                for required in TronGridLite.exe link.dll README.md LICENCE CHANGELOG.md; do
                    [[ -e "$required" ]] || { echo "::error::The artefact is missing $required"; ls -la; exit 1; }
                done
                ls *.spv >/dev/null || { echo "::error::The artefact carries no shaders"; exit 1; }
                ./TronGridLite.exe --version | tee version.txt
                grep -q "TronGrid Lite" version.txt || { echo "::error::The packaged binary did not name itself"; exit 1; }

            - name: Upload artifact (Unix)
              if: runner.os != 'Windows'
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                name: ${{ matrix.artifact }}
                path: ${{ matrix.artifact }}.tar.gz
                retention-days: 1

            - name: Upload artifact (Windows)
              if: runner.os == 'Windows'
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                name: ${{ matrix.artifact }}
                path: ${{ matrix.artifact }}.zip
                retention-days: 1

    release:
        name: Create Release
        needs: [validate, build]
        # A dry run stops here: everything above ran as it would for a tag, and nothing below
        # is done - the one step that cannot be taken back is the one a rehearsal skips.
        if: needs.validate.outputs.is-release == 'true'
        runs-on: ubuntu-latest
        timeout-minutes: 10

        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Download all artifacts
              uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
              with:
                path: artifacts

            - name: List artifacts
              run: find artifacts -type f

            # Every platform delivered, or nothing is published: a matrix leg that quietly failed
            # to upload would otherwise become a release with a platform missing.
            - name: Every artefact arrived
              shell: bash
              run: |
                expected="tron-grid-lite-windows-x86_64 tron-grid-lite-linux-x86_64"
                for name in $expected; do
                    ls artifacts/*/"$name".* >/dev/null 2>&1 || { echo "::error::No artefact named $name arrived"; find artifacts -type f; exit 1; }
                done
                echo "All artefacts present: $expected"

            - name: Generate checksums
              shell: bash
              run: |
                cd artifacts
                find . -type f \( -name "*.tar.gz" -o -name "*.zip" \) -exec mv {} . \;
                sha256sum *.tar.gz *.zip > SHA256SUMS.txt
                cat SHA256SUMS.txt
                # Read back what was just written: the file a downloader will check against.
                sha256sum --check --strict SHA256SUMS.txt

            - name: Attest build provenance
              uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
              with:
                subject-path: |
                    artifacts/*.tar.gz
                    artifacts/*.zip

            - name: Extract release notes from CHANGELOG
              id: release-notes
              shell: bash
              run: |
                VERSION="${{ needs.validate.outputs.version }}"

                # Extract release notes for this version from CHANGELOG.md
                # Uses awk with index() for literal string matching (avoids regex escaping issues)
                awk -v ver="## [${VERSION}]" '
                    index($0, ver) == 1 { found=1; next }
                    found && /^## \[/ { exit }
                    found { print }
                ' CHANGELOG.md > release_notes.md

                # Trim leading/trailing blank lines
                sed -i '/./,$!d' release_notes.md
                sed -i ':a;/^[[:space:]]*$/{$d;N;ba}' release_notes.md

                if [[ -s release_notes.md ]]; then
                    echo "Found release notes in CHANGELOG.md:"
                else
                    echo "No CHANGELOG entry for ${VERSION}, using default"
                    echo "Release ${VERSION}" > release_notes.md
                fi

                echo "--- Release Notes ---"
                cat release_notes.md

            - name: Create GitHub Release
              shell: bash
              env:
                GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                TAG="${{ needs.validate.outputs.tag }}"
                VERSION="${{ needs.validate.outputs.version }}"

                # Determine if this is a prerelease
                PRERELEASE_FLAG=""
                LATEST_FLAG="--latest"
                if [[ "$VERSION" == *-* ]]; then
                    PRERELEASE_FLAG="--prerelease"
                    LATEST_FLAG=""
                fi

                # Create the release with gh CLI (more reliable than third-party actions) - as a
                # draft. Publishing is the one irreversible step, and it stays a person's: the
                # artefacts, the checksums and the attestation can all be looked at first.
                gh release create "$TAG" \
                    --draft \
                    --title "$TAG" \
                    --notes-file release_notes.md \
                    $LATEST_FLAG \
                    $PRERELEASE_FLAG \
                    artifacts/*.tar.gz \
                    artifacts/*.zip \
                    artifacts/SHA256SUMS.txt

                echo "Draft release created: $TAG"
                {
                    echo "## Draft release $TAG is ready"
                    echo
                    echo "Look it over, then publish it with:"
                    echo
                    echo '```'
                    echo "gh release edit $TAG --draft=false"
                    echo '```'
                } >> "$GITHUB_STEP_SUMMARY"
